name: Python CI

on:
  push:
    branches: [ main, feature/calculator ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install pytest black pylint

    - name: Check formatting
      run: black --check .

    - name: Run pylint
      run: pylint utils.py

    - name: Run tests
      run: pytest